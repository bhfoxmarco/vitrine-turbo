<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitrine Turbo · Marco Silva</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold:   #c9a84c;
      --gold2:  #e8d5a3;
      --dark:   #0a0a0a;
      --dark2:  #111111;
      --dark3:  #1a1a1a;
      --text:   #f5f0e8;
      --muted:  #8a8070;
      --border: rgba(201,168,76,0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--dark); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; }

    /* ── TELA GERADOR ── */
    #tela-gerador {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .gerador-inner { width: 100%; max-width: 520px; }
    .logo-linha { display: flex; align-items: center; gap: 14px; margin-bottom: 48px; }
    .logo-icone { width: 42px; height: 42px; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .logo-texto { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; letter-spacing: 0.12em; color: var(--gold2); text-transform: uppercase; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(38px, 8vw, 58px); font-weight: 300; line-height: 1.05; margin-bottom: 16px; }
    h1 em { font-style: italic; color: var(--gold); }
    .subtitulo { font-size: 14px; font-weight: 300; color: var(--muted); line-height: 1.7; margin-bottom: 40px; }
    .campo-label { font-size: 10px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; display: block; }
    input[type="text"] { width: 100%; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-bottom: 1px solid rgba(201,168,76,0.4); padding: 16px 20px; color: var(--text); font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 300; outline: none; margin-bottom: 12px; }
    input[type="text"]:focus { border-color: var(--gold); }
    input[type="text"]::placeholder { color: var(--muted); }
    .btn-principal { width: 100%; background: var(--gold); color: var(--dark); border: none; padding: 18px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
    .btn-principal:hover { background: var(--gold2); }
    .btn-principal:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secundario { width: 100%; background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,0.1); padding: 14px; font-family: 'Outfit', sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; margin-top: 10px; transition: color 0.2s, border-color 0.2s; }
    .btn-secundario:hover { color: var(--text); border-color: rgba(255,255,255,0.3); }
    .loading-bar { height: 2px; background: var(--border); margin-top: 16px; position: relative; overflow: hidden; display: none; }
    .loading-bar::after { content: ''; position: absolute; top: 0; left: -40%; width: 40%; height: 100%; background: var(--gold); animation: slide 1s linear infinite; }
    @keyframes slide { to { left: 140%; } }
    .erro-box { display: none; margin-top: 16px; padding: 14px 18px; border: 1px solid rgba(220,80,80,0.3); background: rgba(220,80,80,0.06); color: #e07070; font-size: 13px; line-height: 1.6; }
    .link-box { display: none; margin-top: 24px; }
    .link-box-titulo { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
    .link-box-url { font-size: 12px; color: rgba(245,240,232,0.5); word-break: break-all; line-height: 1.6; padding: 16px; background: rgba(201,168,76,0.05); border: 1px solid var(--border); margin-bottom: 12px; }
    .label-copiado { display: none; text-align: center; font-size: 14px; font-weight: 500; color: var(--gold); padding: 12px; border: 1px solid rgba(201,168,76,0.4); background: rgba(201,168,76,0.08); margin-top: 10px; }

    /* ── TELA VITRINE ── */
    #tela-vitrine { display: none; min-height: 100vh; }
    .barra-topo { position: fixed; top: 0; left: 0; right: 0; z-index: 200; display: flex; align-items: center; gap: 0; background: rgba(10,10,10,0.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); height: 52px; }
    .btn-voltar { background: transparent; border: none; border-right: 1px solid var(--border); color: var(--text); padding: 0 20px; height: 100%; font-family: 'Outfit', sans-serif; font-size: 12px; letter-spacing: 0.08em; cursor: pointer; transition: color 0.2s; white-space: nowrap; }
    .btn-voltar:hover { color: var(--gold); }
    .nav-imoveis { display: flex; overflow-x: auto; flex: 1; }
    .nav-item { padding: 0 20px; height: 52px; display: flex; align-items: center; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; white-space: nowrap; }
    .nav-item.ativo { color: var(--gold); border-bottom-color: var(--gold); }
    .vitrine-conteudo { padding-top: 52px; }

    /* Hero */
    .hero { position: relative; height: 100vh; overflow: hidden; }
    .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
    .slide.ativo { opacity: 1; }
    .slide img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.05); transition: transform 8s ease; }
    .slide.ativo img { transform: scale(1); }
    .slide-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.75) 100%); }
    .hero-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 60px 48px 48px; z-index: 2; }
    .hero-badge { display: inline-block; border: 1px solid var(--gold); padding: 5px 14px; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 20px; }
    .hero-tipo { font-family: 'Cormorant Garamond', serif; font-size: clamp(36px, 6vw, 64px); font-weight: 300; line-height: 1; margin-bottom: 12px; color: white; }
    .hero-end { font-size: 15px; font-weight: 300; color: rgba(255,255,255,0.7); margin-bottom: 24px; }
    .hero-preco { font-family: 'Cormorant Garamond', serif; font-size: clamp(28px, 4vw, 42px); color: var(--gold2); }
    .slide-ctrl { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.3); color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 3; transition: border-color 0.2s; backdrop-filter: blur(4px); }
    .slide-ctrl:hover { border-color: var(--gold); }
    .slide-ctrl.prev { left: 24px; }
    .slide-ctrl.next { right: 24px; }
    .foto-contador { position: absolute; top: 20px; right: 24px; font-size: 12px; letter-spacing: 0.1em; color: rgba(255,255,255,0.6); z-index: 3; }
    .slide-dots { position: absolute; bottom: 24px; right: 48px; display: flex; gap: 6px; z-index: 3; }
    .dot { width: 24px; height: 2px; background: rgba(255,255,255,0.3); cursor: pointer; transition: background 0.3s, width 0.3s; }
    .dot.ativo { background: var(--gold); width: 48px; }

    /* Detalhes */
    .secao { padding: 60px 48px; max-width: 1100px; margin: 0 auto; }
    .secao-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 24px; }
    .atributos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); margin-bottom: 32px; }
    .atrib { background: var(--dark2); padding: 20px; }
    .atrib-val { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--text); line-height: 1; margin-bottom: 4px; }
    .atrib-nome { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .valor-box { border: 1px solid var(--border); padding: 32px; background: var(--dark2); }
    .valor-principal { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 300; color: var(--gold2); margin-bottom: 20px; line-height: 1; }
    .valor-linha { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
    .valor-linha:last-child { border-bottom: none; }
    .galeria-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 4px; margin-top: 24px; }
    .thumb { aspect-ratio: 4/3; overflow: hidden; cursor: pointer; position: relative; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s, filter 0.3s; filter: brightness(0.85); }
    .thumb:hover img { transform: scale(1.06); filter: brightness(1); }
    .corretor-bar { background: var(--dark3); border-top: 1px solid var(--border); padding: 32px 48px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
    .corretor-avatar { width: 56px; height: 56px; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--gold); flex-shrink: 0; }
    .corretor-nome { font-family: 'Cormorant Garamond', serif; font-size: 20px; }
    .corretor-info { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .btn-agendar { margin-left: auto; border: 1px solid var(--gold); color: var(--gold); background: transparent; padding: 12px 28px; font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; transition: background 0.2s, color 0.2s; }
    .btn-agendar:hover { background: var(--gold); color: var(--dark); }

    @media (max-width: 768px) {
      .hero-info { padding: 40px 24px 32px; }
      .slide-ctrl { display: none; }
      .secao { padding: 40px 24px; }
      .atributos { grid-template-columns: repeat(2, 1fr); }
      .galeria-grid { grid-template-columns: repeat(3, 1fr); }
      .corretor-bar { padding: 28px 24px; }
      .btn-agendar { margin-left: 0; width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

<!-- TELA GERADOR -->
<div id="tela-gerador">
  <div class="gerador-inner">
    <div class="logo-linha">
      <div class="logo-icone">🏛</div>
      <div class="logo-texto">Vitrine Turbo</div>
    </div>
    <h1>Sua vitrine,<br><em>reimaginada.</em></h1>
    <p class="subtitulo">Cole o link da vitrine QuintoAndar e gere uma apresentação premium para impressionar seus clientes.</p>

    <label class="campo-label">Link da vitrine QuintoAndar</label>
    <input type="text" id="inputLink" placeholder="https://vitrine.quintoandar.com.br/... ou http://quin.to/...">

    <button class="btn-principal" id="btnGerar" onclick="gerarVitrine()">Gerar Apresentação</button>

    <div class="loading-bar" id="loadingBar"></div>
    <div class="erro-box" id="erroBox"></div>

    <!-- Área que aparece após gerar -->
    <div class="link-box" id="linkBox">
      <div class="link-box-titulo">Link para o cliente</div>
      <div class="link-box-url" id="linkUrl"></div>
      <button class="btn-principal" onclick="copiarLink()">📋 Copiar link para o cliente</button>
      <div class="label-copiado" id="labelCopiado">✅ Link do cliente copiado!</div>
      <button class="btn-secundario" onclick="mostrarVitrine()">👁 Ver apresentação</button>
    </div>
  </div>
</div>

<!-- TELA VITRINE -->
<div id="tela-vitrine">
  <div class="barra-topo">
    <button class="btn-voltar" onclick="voltarGerador()">← Voltar</button>
    <div class="nav-imoveis" id="navImoveis"></div>
  </div>
  <div class="vitrine-conteudo" id="vitrineConteudo"></div>
</div>

<script>
// Estado global
var dadosVitrine = null;
var imovelAtual  = 0;
var slideAtual   = 0;
var timerSlide   = null;
var linkGerado   = '';

// ── Ao carregar a página, verifica se tem ?v= na URL ──────────────────────
window.onload = function() {
  var params   = new URLSearchParams(window.location.search);
  var linkParam = params.get('v');
  if (linkParam) {
    document.getElementById('inputLink').value = linkParam;
    gerarVitrine(true); // true = modo cliente, vai direto para vitrine
  }
};

// ── Extrai o ID do link ────────────────────────────────────────────────────
function extrairId(link) {
  var uuid = link.match(/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i);
  if (uuid) return { tipo: 'vitrine', id: uuid[1] };
  var imovel = link.match(/\/imovel\/v2\/(\d+)/);
  if (imovel) return { tipo: 'imovel', id: imovel[1] };
  if (link.indexOf('quin.to') !== -1) return { tipo: 'encurtado', id: link.trim() };
  return null;
}

// ── Resolve link encurtado quin.to ────────────────────────────────────────
async function resolverEncurtado(linkCurto) {
  try {
    var resp  = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(linkCurto));
    var dados = await resp.json();
    var urlFinal = dados.status ? dados.status.url : '';
    var uuid = urlFinal.match(/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i);
    if (uuid) return { tipo: 'vitrine', id: uuid[1] };
    var imovel = urlFinal.match(/\/imovel\/v2\/(\d+)/);
    if (imovel) return { tipo: 'imovel', id: imovel[1] };
  } catch(e) {}
  return null;
}

// ── Busca dados via API com múltiplos proxies ─────────────────────────────
async function buscarDados(tipo, id) {
  var url = tipo === 'vitrine'
    ? 'https://api-mobile-ro.quintoandar.com.br/shopwindows/' + id
    : 'https://api-mobile-ro.quintoandar.com.br/shopwindows/imovel/' + id;

  // Proxy 1: corsproxy.io
  try {
    var r = await fetch('https://corsproxy.io/?' + encodeURIComponent(url));
    if (r.ok) {
      var d = await r.json();
      if (d && (d.listings || d.id)) return d;
    }
  } catch(e) {}

  // Proxy 2: allorigins
  try {
    var r2 = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(url));
    if (r2.ok) {
      var d2 = await r2.json();
      var parsed = JSON.parse(d2.contents);
      if (parsed && (parsed.listings || parsed.id)) return parsed;
    }
  } catch(e) {}

  throw new Error('Não foi possível carregar os dados');
}

// ── Gera a vitrine ────────────────────────────────────────────────────────
async function gerarVitrine(modoCliente) {
  var link = document.getElementById('inputLink').value.trim();
  if (!link) return;

  var extraido = extrairId(link);
  if (!extraido) { mostrarErro('Link inválido. Use um link da vitrine QuintoAndar.'); return; }

  document.getElementById('btnGerar').disabled = true;
  document.getElementById('loadingBar').style.display = 'block';
  document.getElementById('erroBox').style.display = 'none';
  document.getElementById('linkBox').style.display = 'none';

  try {
    if (extraido.tipo === 'encurtado') {
      extraido = await resolverEncurtado(extraido.id);
      if (!extraido) throw new Error('Não foi possível resolver o link encurtado.');
    }

    var dados = await buscarDados(extraido.tipo, extraido.id);
    dadosVitrine = dados.listings ? dados.listings : [dados];
    if (!dadosVitrine.length) throw new Error('Nenhum imóvel encontrado');

    // Gera o link do cliente
    var base = window.location.origin + window.location.pathname;
    linkGerado = base + '?v=' + encodeURIComponent(link);

    if (modoCliente) {
      // Se veio pelo link do cliente, abre direto a vitrine
      mostrarVitrine();
    } else {
      // Mostra a caixa com o link para copiar
      document.getElementById('linkUrl').textContent = linkGerado;
      document.getElementById('linkBox').style.display = 'block';
      document.getElementById('labelCopiado').style.display = 'none';
    }

  } catch(e) {
    mostrarErro('Não foi possível carregar a vitrine. Verifique o link e tente novamente.');
  } finally {
    document.getElementById('btnGerar').disabled = false;
    document.getElementById('loadingBar').style.display = 'none';
  }
}

// ── Copia o link ──────────────────────────────────────────────────────────
function copiarLink() {
  if (!linkGerado) return;

  function confirmar() {
    document.getElementById('labelCopiado').style.display = 'block';
    setTimeout(function() {
      document.getElementById('labelCopiado').style.display = 'none';
    }, 4000);
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(linkGerado).then(confirmar).catch(function() {
      fallbackCopiar(linkGerado);
      confirmar();
    });
  } else {
    fallbackCopiar(linkGerado);
    confirmar();
  }
}

function fallbackCopiar(texto) {
  var el = document.createElement('textarea');
  el.value = texto;
  el.style.position = 'fixed';
  el.style.opacity = '0';
  document.body.appendChild(el);
  el.focus();
  el.select();
  document.execCommand('copy');
  document.body.removeChild(el);
}

// ── Mostra a vitrine ──────────────────────────────────────────────────────
function mostrarVitrine() {
  document.getElementById('tela-gerador').style.display = 'none';
  document.getElementById('tela-vitrine').style.display = 'block';

  // Monta navegação
  var nav = document.getElementById('navImoveis');
  if (dadosVitrine.length > 1) {
    nav.innerHTML = dadosVitrine.map(function(im, i) {
      return '<div class="nav-item ' + (i===0?'ativo':'') + '" onclick="trocarImovel(' + i + ')">' +
        im.type + ' ' + (i+1) + ' · ' + (im.address ? im.address.neighborhood : '') + '</div>';
    }).join('');
  }

  imovelAtual = 0;
  renderizarImovel(0);
}

// ── Volta para o gerador ──────────────────────────────────────────────────
function voltarGerador() {
  if (timerSlide) clearInterval(timerSlide);
  document.getElementById('tela-vitrine').style.display = 'none';
  document.getElementById('tela-gerador').style.display = 'flex';
}

// ── Troca imóvel ──────────────────────────────────────────────────────────
function trocarImovel(idx) {
  imovelAtual = idx;
  document.querySelectorAll('.nav-item').forEach(function(el, i) {
    el.classList.toggle('ativo', i === idx);
  });
  renderizarImovel(idx);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Renderiza imóvel ──────────────────────────────────────────────────────
function renderizarImovel(idx) {
  var im    = dadosVitrine[idx];
  var fotos = im.images || [];
  var end   = im.address || {};
  var neg   = im.businessContext === 'SALE' ? 'Venda' : 'Aluguel';

  slideAtual = 0;
  if (timerSlide) clearInterval(timerSlide);

  function fixUrl(u) { return u ? (u.startsWith('//') ? 'https:' + u : u) : ''; }
  function fmt(v) { return 'R$ ' + Number(v).toLocaleString('pt-BR'); }

  var fotosHero = fotos.slice(0, 20);
  var slides = fotosHero.map(function(f, i) {
    return '<div class="slide ' + (i===0?'ativo':'') + '" id="sl' + i + '">' +
      '<img src="' + fixUrl(f.url) + '" loading="' + (i<3?'eager':'lazy') + '">' +
      '<div class="slide-overlay"></div></div>';
  }).join('');

  var dots = fotosHero.slice(0, 10).map(function(_, i) {
    return '<div class="dot ' + (i===0?'ativo':'') + '" onclick="irSlide(' + i + ')"></div>';
  }).join('');

  var attrs = [
    { v: im.bedrooms, n: 'Quartos' },
    { v: im.totalArea ? im.totalArea + 'm²' : null, n: 'Área' },
    { v: im.parkingSlots, n: 'Vagas' },
    { v: im.bathrooms, n: 'Banheiros' }
  ].filter(function(a) { return a.v; }).map(function(a) {
    return '<div class="atrib"><div class="atrib-val">' + a.v + '</div><div class="atrib-nome">' + a.n + '</div></div>';
  }).join('');

  var preco = im.salePrice ? fmt(im.salePrice) : (im.rentalTotalCost ? fmt(im.rentalTotalCost) + '/mês' : '');

  var valLines = '';
  if (im.condominiumValue > 0) valLines += '<div class="valor-linha"><span style="color:var(--muted)">Condomínio</span><span>' + fmt(im.condominiumValue) + '/mês</span></div>';
  if (im.iptuValue > 0) valLines += '<div class="valor-linha"><span style="color:var(--muted)">IPTU</span><span>' + fmt(im.iptuValue) + '/mês</span></div>';

  var galeria = fotos.map(function(f, i) {
    var ii = Math.min(i, fotosHero.length - 1);
    return '<div class="thumb" onclick="irSlide(' + ii + ');window.scrollTo({top:0,behavior:\'smooth\'})">' +
      '<img src="' + fixUrl(f.url) + '" loading="lazy"></div>';
  }).join('');

  document.getElementById('vitrineConteudo').innerHTML =
    '<div class="hero">' + slides +
    '<div class="foto-contador" id="fc">1 / ' + fotosHero.length + '</div>' +
    '<button class="slide-ctrl prev" onclick="moverSlide(-1)">‹</button>' +
    '<button class="slide-ctrl next" onclick="moverSlide(1)">›</button>' +
    '<div class="hero-info">' +
      '<div class="hero-badge">' + neg + ' · ' + (end.neighborhood||'') + ', ' + (end.city||'') + '</div>' +
      '<div class="hero-tipo">' + (im.type||'Imóvel') + '</div>' +
      '<div class="hero-end">' + (end.address||'') + ', ' + (end.number||'') + ' · ' + (end.neighborhood||'') + '</div>' +
      '<div class="hero-preco">' + preco + '</div>' +
    '</div>' +
    '<div class="slide-dots">' + dots + '</div></div>' +

    '<div class="secao" style="background:var(--dark2)">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:60px">' +
        '<div><div class="secao-label">Características</div><div class="atributos">' + attrs + '</div></div>' +
        '<div><div class="secao-label">Investimento</div>' +
          '<div class="valor-box"><div class="valor-principal">' + preco + '</div>' + valLines + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="secao" style="background:var(--dark)">' +
      '<div class="secao-label">' + fotos.length + ' Fotografias</div>' +
      '<div class="galeria-grid">' + galeria + '</div>' +
    '</div>' +

    '<div class="corretor-bar">' +
      '<div class="corretor-avatar">MS</div>' +
      '<div><div class="corretor-nome">Marco Antônio da Silva</div>' +
      '<div class="corretor-info">CRECI 46689 · Corretor Parceiro QuintoAndar</div></div>' +
      '<a class="btn-agendar" href="https://www.quintoandar.com.br/imovel/' + im.id + '/comprar" target="_blank">Agendar visita →</a>' +
    '</div>';

  timerSlide = setInterval(function() { moverSlide(1); }, 5000);
}

// ── Slideshow ─────────────────────────────────────────────────────────────
function moverSlide(dir) {
  var total = Math.min((dadosVitrine[imovelAtual].images||[]).length, 20);
  var ant = slideAtual;
  slideAtual = (slideAtual + dir + total) % total;
  atualizarSlide(ant);
}

function irSlide(idx) {
  var ant = slideAtual;
  slideAtual = idx;
  atualizarSlide(ant);
  if (timerSlide) { clearInterval(timerSlide); timerSlide = setInterval(function() { moverSlide(1); }, 5000); }
}

function atualizarSlide(ant) {
  var el = document.getElementById('sl' + ant);
  if (el) el.classList.remove('ativo');
  var el2 = document.getElementById('sl' + slideAtual);
  if (el2) el2.classList.add('ativo');
  var fc = document.getElementById('fc');
  if (fc) fc.textContent = (slideAtual+1) + ' / ' + Math.min((dadosVitrine[imovelAtual].images||[]).length, 20);
  document.querySelectorAll('.dot').forEach(function(d, i) { d.classList.toggle('ativo', i === slideAtual % 10); });
}

// ── Mostrar erro ──────────────────────────────────────────────────────────
function mostrarErro(msg) {
  var el = document.getElementById('erroBox');
  el.textContent = msg;
  el.style.display = 'block';
}

// Teclado
document.addEventListener('keydown', function(e) {
  if (document.getElementById('tela-vitrine').style.display === 'none') return;
  if (e.key === 'ArrowLeft')  moverSlide(-1);
  if (e.key === 'ArrowRight') moverSlide(1);
  if (e.key === 'Escape')     voltarGerador();
});

// Enter no campo
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('inputLink').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') gerarVitrine();
  });
});
</script>
